<!DOCTYPE html>
<!-- Checks that an exported scene behaves when embedded the way it will be on
     digital-landscapes.com: inside an iframe, sized by the host page. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DL-SplatGenerator iframe embed test</title>
<style>
  body { font: 15px/1.6 system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
  iframe { width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 8px; }
</style>
</head>
<body>
<h1>Host page</h1>
<p>Body text before the embed, to prove the page flows normally around it.</p>
<iframe id="frame" src="embed-test.html" allowfullscreen loading="lazy"></iframe>
<p>Body text after the embed.</p>
</body>
</html>
